name: External benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  external:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pinned external repositories
        run: python benchmarks/external.py

      - uses: actions/upload-artifact@v4
        with:
          name: external-benchmark
          path: |
            benchmarks/EXTERNAL.md
            benchmarks/external.json
